[package]
name = "boring-codec-f32-gen"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Generated Rust side of the boring codec under the f32 precision switch (docs/specs/features/23-float-precision-switch.md)"

[lib]
path = "src/lib.rs"

# Test suites live outside the crate directory, next to the tests of the
# other languages; cargo reaches them through explicit paths.
[[test]]
name = "vector_gen_f32"
path = "../../tests/rust/vector_gen_f32.rs"
