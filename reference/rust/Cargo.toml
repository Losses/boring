[package]
name = "boring-codec"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Rust side of the boring shared-language-subset codec experiment"

[lib]
path = "src/lib.rs"

# Test suites live outside the crate directory, next to the tests of the
# other languages; cargo reaches them through explicit paths.
[[test]]
name = "vector"
path = "../../tests/rust/vector.rs"
