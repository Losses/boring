# Root cargo workspace, symmetric with the bun workspace in package.json.
# Member crates hold the language implementations; test suites live in
# tests/ and are wired into crates through explicit [[test]] paths.
# The generated codec crates carry their own emitted Cargo.toml at their
# output root (feature spec 24) and declare themselves workspace roots, so
# they stay outside this workspace and run through their own manifest paths:
# the f64 crate at the bundle driver's derived directory reference/rust/gen
# (feature spec 59) and the f32 twin (feature spec 23). A plain `cargo test`
# therefore needs no generated tree, and needs no f32 tree (see the exclusion
# below).
[workspace]
members = ["reference/rust"]
default-members = ["reference/rust"]
# Generated trees are build output, never members. The runner-timeout probe
# (tests/timeout-probe/rust.hxml) emits one crate under out/, and cargo
# refuses to build a package that sits under the workspace root without being
# a member or an exclusion. Both generated codec crates are excluded for the
# same reason: the emitter declares each one a workspace root of its own (it
# carries the semantic test crates), so cargo would otherwise see two
# workspace roots for one tree. Their suites run by manifest path:
#   cargo test --manifest-path reference/rust/gen/Cargo.toml
#   cargo test --features f32 --manifest-path reference/rust-f32/gen/Cargo.toml
exclude = ["out", "reference/rust/gen", "reference/rust-f32/gen"]
resolver = "3"
