name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      # ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
      # which blocks the bwrap sandbox of the Swift FHS wrapper; older
      # images without this sysctl have no restriction to lift.
      - name: Allow user namespaces for the Swift FHS wrapper
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Restore nix closure
        uses: actions/cache@v4
        with:
          path: nix-closure.nar
          key: nix-closure-linux-${{ hashFiles('flake.lock') }}
          restore-keys: nix-closure-linux-
      - name: Import nix closure
        if: hashFiles('nix-closure.nar') != ''
        run: sudo nix-store --import < nix-closure.nar || true
      - name: Run generation and tests
        run: nix develop -c bash -c 'bun install && bun run gen:ts && bun run gen:kotlin && bun run gen:kotlin-f32 && bun run gen:rust && bun run gen:rust-f32 && bun run gen:swift && bun run gen:swift-f32 && bun run gen:dart && bun run test:stage1:haxe && bun run test:stage1:ts && bun run test:stage1:kotlin && bun run test:stage1:rust && bun run test:haxe && bun run test:kotlin && bun run test:rust && bun run test:swift && bun run test:swift-f32 && bun run test:dart && bun run test:kotlin-f32 && bun run test:rust-f32 && bun run test:consistency && bun run check:docs'
      # BoringSwiftTests segfaulted on CI while the same tree and toolchain
      # pass locally, and the redirected stdout is fully buffered so the
      # log shows nothing. The only library that differs between the two
      # machines is the system libstdc++ (everything else resolves into
      # identical nix store paths), so the diagnostics rerun once with the
      # nix closure's libstdc++ preferred and once under a debugger.
      - name: Dump Swift crash diagnostics
        if: failure()
        run: |
          echo '--- tail of out/test-results/swift.jsonl ---'
          tail -c 2000 out/test-results/swift.jsonl 2>/dev/null || echo '(no swift.jsonl)'
          echo '--- kernel segfault records ---'
          sudo dmesg | grep -i segfault | tail -6 || true
          echo '--- rerun with nix closure libstdc++ preferred ---'
          nix develop -c bash -c '
            GCCLIB="$(nix-store -qR "$(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)" | grep -E "gcc-[0-9.]+-lib$" | head -1)"
            echo "gcc lib dir: $GCCLIB"
            if [ -n "$GCCLIB" ]; then
              LD_LIBRARY_PATH="$GCCLIB/lib:$BORING_SWIFT_LIBDISPATCH" ./.build/debug/BoringSwiftTests > /tmp/probe.jsonl 2>&1
              echo "probe rc=$? jsonl bytes=$(wc -c < /tmp/probe.jsonl)"
              tail -c 400 /tmp/probe.jsonl
            fi
          ' || true
          echo '--- backtrace under gdb ---'
          (sudo apt-get update -qq && sudo apt-get install -y -qq gdb >/dev/null 2>&1) || true
          nix develop -c bash -c 'command -v gdb >/dev/null 2>&1 || exit 0; gdb -batch -ex "run > /dev/null 2>&1" -ex "bt 20" -ex "x/6i \$rip" --args ./.build/debug/BoringSwiftTests' 2>&1 | tail -50 || true
      - name: Export nix closure
        if: always()
        run: nix-store --export $(nix-store -qR $(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)) > nix-closure.nar

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Restore nix closure
        uses: actions/cache@v4
        with:
          path: nix-closure.nar
          key: nix-closure-macos-${{ hashFiles('flake.lock') }}
          restore-keys: nix-closure-macos-
      - name: Import nix closure
        if: hashFiles('nix-closure.nar') != ''
        run: sudo nix-store --import < nix-closure.nar || true
      - name: Swift toolchain version
        run: swift --version
      - name: Run generation and tests
        # Echo the toolchain variables the darwin shellHook pins so the
        # log shows what SwiftPM actually saw if the manifest build fails.
        run: nix develop -c bash -c 'echo "SDKROOT=$SDKROOT CC=$CC DEVELOPER_DIR=$DEVELOPER_DIR" && bun install && bun run gen:ts && bun run gen:kotlin && bun run gen:kotlin-f32 && bun run gen:rust && bun run gen:rust-f32 && bun run gen:swift && bun run gen:swift-f32 && bun run gen:dart && bun run test:stage1:haxe && bun run test:stage1:ts && bun run test:stage1:kotlin && bun run test:stage1:rust && bun run test:haxe && bun run test:kotlin && bun run test:rust && bun run test:swift && bun run test:swift-f32 && bun run test:dart && bun run test:kotlin-f32 && bun run test:rust-f32 && bun run test:consistency && bun run check:docs'
      - name: Export nix closure
        if: always()
        run: nix-store --export $(nix-store -qR $(nix build .#devShells.aarch64-darwin.default --no-link --print-out-paths)) > nix-closure.nar

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # choco only packages Haxe 4.3.4, but the nix devShell pins 4.3.7
      # and PipelineExpander.hx:1867 types differently on 4.3.4
      # ("has extra field isStatic"); install the official 4.3.7 archive.
      # Neko comes from choco, which sets NEKOPATH for haxelib.
      - name: Install Haxe 4.3.7 and Neko
        run: |
          choco install neko --yes --no-progress
          curl -sL -o haxe.zip https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-win64.zip
          powershell.exe -NoProfile -Command 'Expand-Archive -Path haxe.zip -DestinationPath "$env:USERPROFILE\haxe-4.3.7" -Force'
          HAXE_EXE="$(find "$HOME/haxe-4.3.7" -name haxe.exe -print -quit 2>/dev/null)"
          if [ -z "$HAXE_EXE" ]; then
            echo "haxe.exe not found in extracted archive" >&2
            exit 1
          fi
          echo "$(dirname "$HAXE_EXE")" >> "$GITHUB_PATH"
          "$HAXE_EXE" --version
      - name: Install Bun
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm bun.sh/install.ps1 | iex"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # The Swift-on-Windows installer needs elevation and records its
      # PATH entries in the registry rather than a fixed location, so
      # installation and PATH discovery are left to the action; its
      # cache input caches the installer download.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
          cache: true
      - name: Install reflaxe and format
        run: |
          git clone https://github.com/SomeRanDev/reflaxe.git .reflaxe
          git -C .reflaxe checkout 9fa459a0b4436d1706db6495823b81f2947ff7a0
          haxelib dev reflaxe "$PWD/.reflaxe"
          haxelib dev boring "$PWD"
          haxelib install format 3.8.0
      # The root Package.swift declares the CodecF32 target at
      # reference/swift-f32/gen, and swift build validates every declared
      # target path when loading the manifest, so the f32 tree must be
      # generated even though only the f64 products are tested here.
      - name: Run Swift generation and tests
        run: bun install && bun run gen:swift && bun run gen:swift-f32 && bun run test:swift
      # BoringSwiftTests runs to completion here but reports failed tests
      # through its exit code, and the jsonl redirect hides the details.
      - name: Dump Swift test failures
        if: failure()
        run: |
          echo '--- failing records in out/test-results/swift.jsonl ---'
          wc -l out/test-results/swift.jsonl 2>/dev/null || echo '(no swift.jsonl)'
          grep -v '"verdict":"pass"' out/test-results/swift.jsonl 2>/dev/null | tail -40 || echo '(all records pass)'
      # envRoundTrip and pathExpandHome report that a value written with
      # _putenv_s is not visible to getenv in the same process, which the
      # CRT pair should guarantee; this standalone probe reproduces the
      # sequence outside the SwiftPM test binary to pin which layer loses
      # the write.
      - name: Probe CRT environment visibility
        if: failure()
        run: |
          cat > envprobe.swift <<'EOF'
          import MSVCRT

          if let v = getenv("PROBE_FROM_BASH") {
              print("getenv PROBE_FROM_BASH: \(String(cString: v))")
          } else {
              print("getenv PROBE_FROM_BASH: nil")
          }
          if let v = getenv("HOME") {
              print("getenv HOME: \(String(cString: v))")
          } else {
              print("getenv HOME: nil")
          }
          let rc = _putenv_s("PROBE_KEY", "probe_value")
          print("_putenv_s rc: \(rc)")
          if let v = getenv("PROBE_KEY") {
              print("getenv PROBE_KEY after set: \(String(cString: v))")
          } else {
              print("getenv PROBE_KEY after set: nil")
          }
          _ = system("echo child sees PROBE_KEY=%PROBE_KEY%")
          let rc2 = _putenv("PROBE_KEY=")
          print("_putenv remove rc: \(rc2)")
          if let v = getenv("PROBE_KEY") {
              print("getenv PROBE_KEY after remove: \(String(cString: v))")
          } else {
              print("getenv PROBE_KEY after remove: nil")
          }
          EOF
          swiftc envprobe.swift -o envprobe.exe && PROBE_FROM_BASH=bashvalue ./envprobe.exe
