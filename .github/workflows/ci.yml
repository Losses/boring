name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      # ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
      # which blocks the bwrap sandbox of the Swift FHS wrapper; older
      # images without this sysctl have no restriction to lift.
      - name: Allow user namespaces for the Swift FHS wrapper
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Restore nix closure
        uses: actions/cache@v4
        with:
          path: nix-closure.nar
          key: nix-closure-linux-${{ hashFiles('flake.lock') }}
          restore-keys: nix-closure-linux-
      - name: Import nix closure
        if: hashFiles('nix-closure.nar') != ''
        run: sudo nix-store --import < nix-closure.nar || true
      - name: Run generation and tests
        run: nix develop -c bash -c 'bun install && bun run gen:ts && bun run gen:kotlin && bun run gen:kotlin-f32 && bun run gen:rust && bun run gen:rust-f32 && bun run gen:swift && bun run gen:swift-f32 && bun run gen:dart && bun run warning:gate && bun run test:stage1:haxe && bun run test:stage1:ts && bun run test:stage1:kotlin && bun run test:stage1:rust && bun run test:haxe && bun run test:kotlin && bun run test:rust && bun run test:swift && bun run test:swift-f32 && bun run test:dart && bun run test:kotlin-f32 && bun run test:rust-f32 && bun run test:stage1:dart && bun run test:consistency && bun run check:docs && bun run check:ledger && bun run check:registry && bun run check:mapping' || { echo '--- PrintedCollection comparator lines ---'; sed -n '70,86p' reference/kotlin/gen/boring/PrintedCollection.kt; echo '--- DartCharNullOps compareShape ---'; grep -n 'compareShape' -A 5 reference/kotlin/gen/boring/DartCharNullOps.kt; (exit 1); }
      # BoringSwiftTests segfaulted on CI while the same tree and toolchain
      # pass locally, and the redirected stdout is fully buffered so the
      # log shows nothing. The only library that differs between the two
      # machines is the system libstdc++ (everything else resolves into
      # identical nix store paths), so the diagnostics rerun once with the
      # nix closure's libstdc++ preferred and once under a debugger.
      - name: Dump Swift crash diagnostics
        if: failure()
        run: |
          echo '--- tail of out/test-results/swift.jsonl ---'
          tail -c 2000 out/test-results/swift.jsonl 2>/dev/null || echo '(no swift.jsonl)'
          echo '--- kernel segfault records ---'
          sudo dmesg | grep -i segfault | tail -6 || true
          echo '--- rerun with nix closure libstdc++ preferred ---'
          nix develop -c bash -c '
            GCCLIB="$(nix-store -qR "$(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)" | grep -E "gcc-[0-9.]+-lib$" | head -1)"
            echo "gcc lib dir: $GCCLIB"
            if [ -n "$GCCLIB" ]; then
              LD_LIBRARY_PATH="$GCCLIB/lib:$BORING_SWIFT_LIBDISPATCH" ./.build/debug/BoringSwiftTests > /tmp/probe.jsonl 2>&1
              echo "probe rc=$? jsonl bytes=$(wc -c < /tmp/probe.jsonl)"
              tail -c 400 /tmp/probe.jsonl
            fi
          ' || true
          echo '--- backtrace under gdb ---'
          (sudo apt-get update -qq && sudo apt-get install -y -qq gdb >/dev/null 2>&1) || true
          nix develop -c bash -c 'command -v gdb >/dev/null 2>&1 || exit 0; gdb -batch -ex "run > /dev/null 2>&1" -ex "bt 20" -ex "x/6i \$rip" -ex "info symbol \$rip" -ex "info proc mappings" --args ./.build/debug/BoringSwiftTests' 2>&1 | tail -150 || true
      # The r12 crash is closed: the toolchain records a generic /lib64
      # interpreter while the RUNPATH resolves libc to the nix glibc, so
      # the runner's ubuntu 2.39 loader drove the 2.42 libc and the
      # process died before main (reproduced locally by mixing those two
      # and fixed by pinning the interpreter at link time). These probes
      # verify the pin if the suite ever crashes again: they read the
      # binary's actual interpreter and rerun through it explicitly.
      - name: Probe loader and environment conditioning
        if: failure()
        run: |
          nix develop -c bash -c '
            INTERP="$(readelf -l ./.build/debug/BoringSwiftTests | grep "Requesting program interpreter" | sed "s/.*: //;s/\]//")"
            echo "interpreter: $INTERP"
            if [ -x "$INTERP" ]; then
              rc=0
              "$INTERP" --library-path "$BORING_SWIFT_LIBDISPATCH" ./.build/debug/BoringSwiftTests > /tmp/probe-interp.jsonl 2>&1 || rc=$?
              echo "interpreter rerun rc=$rc jsonl bytes=$(wc -c < /tmp/probe-interp.jsonl)"
              tail -c 400 /tmp/probe-interp.jsonl
            fi
            echo "--- environment conditioning ---"
            echo "randomize_va_space=$(cat /proc/sys/kernel/randomize_va_space)"
            rc=0
            env -i LD_LIBRARY_PATH="$BORING_SWIFT_LIBDISPATCH" ./.build/debug/BoringSwiftTests > /tmp/probe-envi.jsonl 2>&1 || rc=$?
            echo "env -i probe rc=$rc jsonl bytes=$(wc -c < /tmp/probe-envi.jsonl)"
            LD_SHOW_AUXV=1 /bin/true 2>&1 | grep -E "AT_SYSINFO_EHDR|AT_PLATFORM|AT_HWCAP" || true
          ' || true
      - name: Dump Swift crash diagnostics
        if: failure()
        run: |
          echo '--- nonpassing records in out/test-results/swift.jsonl ---'
          grep -v '"verdict":"pass"' out/test-results/swift.jsonl 2>/dev/null | tail -40 || echo '(no nonpassing records)'
      # The CI binary segfaults while the same tree passes locally, so the
      # binary itself and the (possibly truncated) jsonl are uploaded for a
      # byte-level local reproduction alongside a runner fingerprint.
      - name: Upload Swift crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-swift-crash
          path: |
            .build/x86_64-unknown-linux-gnu/debug/BoringSwiftTests
            out/test-results/swift.jsonl
      - name: Record runner environment fingerprint
        if: failure()
        run: |
          ldd --version | head -1
          uname -a
          grep -m1 'model name' /proc/cpuinfo || true
          grep -m1 flags /proc/cpuinfo || true
      - name: Export nix closure
        if: always()
        run: nix-store --export $(nix-store -qR $(nix build .#devShells.x86_64-linux.default --no-link --print-out-paths)) > nix-closure.nar

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Restore nix closure
        uses: actions/cache@v4
        with:
          path: nix-closure.nar
          key: nix-closure-macos-${{ hashFiles('flake.lock') }}
          restore-keys: nix-closure-macos-
      - name: Import nix closure
        if: hashFiles('nix-closure.nar') != ''
        run: sudo nix-store --import < nix-closure.nar || true
      - name: Swift toolchain version
        run: swift --version
      - name: Run generation and tests
        # Echo the toolchain variables the darwin shellHook pins so the
        # log shows what SwiftPM actually saw if the manifest build fails.
        run: nix develop -c bash -c 'echo "SDKROOT=$SDKROOT CC=$CC DEVELOPER_DIR=$DEVELOPER_DIR" && bun install && bun run gen:ts && bun run gen:kotlin && bun run gen:kotlin-f32 && bun run gen:rust && bun run gen:rust-f32 && bun run gen:swift && bun run gen:swift-f32 && bun run gen:dart && bun run test:stage1:haxe && bun run test:stage1:ts && bun run test:stage1:kotlin && bun run test:stage1:rust && bun run test:haxe && bun run test:kotlin && bun run test:rust && bun run test:swift && bun run test:swift-f32 && bun run test:dart && bun run test:kotlin-f32 && bun run test:rust-f32 && bun run test:stage1:dart && bun run test:consistency && bun run check:docs && bun run check:ledger && bun run check:registry && bun run check:mapping' || { echo '--- PrintedCollection comparator lines ---'; sed -n '70,86p' reference/kotlin/gen/boring/PrintedCollection.kt; echo '--- DartCharNullOps compareShape ---'; grep -n 'compareShape' -A 5 reference/kotlin/gen/boring/DartCharNullOps.kt; (exit 1); }
      # BoringSwiftTests reports failed tests through its exit code while
      # the jsonl redirect hides the details, so dump the nonpassing
      # records the same way the windows job does.
      - name: Dump Swift test failures
        if: failure()
        run: |
          echo '--- failing records in out/test-results/swift.jsonl ---'
          wc -l out/test-results/swift.jsonl 2>/dev/null || echo '(no swift.jsonl)'
          grep -v '"verdict":"pass"' out/test-results/swift.jsonl 2>/dev/null | tail -40 || echo '(all records pass)'
      - name: Export nix closure
        if: always()
        run: nix-store --export $(nix-store -qR $(nix build .#devShells.aarch64-darwin.default --no-link --print-out-paths)) > nix-closure.nar

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # choco only packages Haxe 4.3.4, but the nix devShell pins 4.3.7
      # and PipelineExpander.hx:1867 types differently on 4.3.4
      # ("has extra field isStatic"); install the official 4.3.7 archive.
      # Neko comes from choco, which sets NEKOPATH for haxelib.
      - name: Install Haxe 4.3.7 and Neko
        run: |
          choco install neko --yes --no-progress
          curl -sL -o haxe.zip https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-win64.zip
          powershell.exe -NoProfile -Command 'Expand-Archive -Path haxe.zip -DestinationPath "$env:USERPROFILE\haxe-4.3.7" -Force'
          HAXE_EXE="$(find "$HOME/haxe-4.3.7" -name haxe.exe -print -quit 2>/dev/null)"
          if [ -z "$HAXE_EXE" ]; then
            echo "haxe.exe not found in extracted archive" >&2
            exit 1
          fi
          echo "$(dirname "$HAXE_EXE")" >> "$GITHUB_PATH"
          "$HAXE_EXE" --version
      - name: Install Bun
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm bun.sh/install.ps1 | iex"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # The Swift-on-Windows installer needs elevation and records its
      # PATH entries in the registry rather than a fixed location, so
      # installation and PATH discovery are left to the action; its
      # cache input caches the installer download.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
          cache: true
      - name: Install reflaxe and format
        run: |
          git clone https://github.com/SomeRanDev/reflaxe.git .reflaxe
          git -C .reflaxe checkout 9fa459a0b4436d1706db6495823b81f2947ff7a0
          haxelib dev reflaxe "$PWD/.reflaxe"
          haxelib dev boring "$PWD"
          haxelib install format 3.8.0
      # The root Package.swift declares the CodecF32 target at
      # reference/swift-f32/gen, and swift build validates every declared
      # target path when loading the manifest, so the f32 tree must be
      # generated even though only the f64 products are tested here.
      - name: Run Swift generation and tests
        run: bun install && bun run gen:swift && bun run gen:swift-f32 && bun run test:swift
      # BoringSwiftTests runs to completion here but reports failed tests
      # through its exit code, and the jsonl redirect hides the details.
      - name: Dump Swift test failures
        if: failure()
        run: |
          echo '--- failing records in out/test-results/swift.jsonl ---'
          wc -l out/test-results/swift.jsonl 2>/dev/null || echo '(no swift.jsonl)'
          grep -v '"verdict":"pass"' out/test-results/swift.jsonl 2>/dev/null | tail -40 || echo '(all records pass)'
      # envRoundTrip and pathExpandHome report that a value written with
      # _putenv_s is not visible to getenv in the same process, which the
      # CRT pair should guarantee; this standalone probe reproduces the
      # sequence outside the SwiftPM test binary to pin which layer loses
      # the write.
      - name: Probe CRT environment visibility
        if: failure()
        # A bare `swiftc file.swift` cannot resolve `import CRT` (the
        # module lives where only SwiftPM's build looks), so the probe is
        # a throwaway SwiftPM package built the same way as the main
        # chain. If the process environment set by bash is invisible to
        # getenv, the CRT environ the test binary reads is a different
        # view than the one _putenv_s writes.
        run: |
          mkdir -p envprobe/Sources/EnvProbe
          cat > envprobe/Package.swift <<'PKG'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "EnvProbe",
              targets: [.executableTarget(name: "EnvProbe")]
          )
          PKG
          cat > envprobe/Sources/EnvProbe/main.swift <<'EOF'
          import CRT

          if let v = getenv("PROBE_FROM_BASH") {
              print("getenv PROBE_FROM_BASH: \(String(cString: v))")
          } else {
              print("getenv PROBE_FROM_BASH: nil")
          }
          if let v = getenv("HOME") {
              print("getenv HOME: \(String(cString: v))")
          } else {
              print("getenv HOME: nil")
          }
          let rc = _putenv_s("PROBE_KEY", "probe_value")
          print("_putenv_s rc: \(rc)")
          if let v = getenv("PROBE_KEY") {
              print("getenv PROBE_KEY after set: \(String(cString: v))")
          } else {
              print("getenv PROBE_KEY after set: nil")
          }
          _ = system("echo child sees PROBE_KEY=%PROBE_KEY%")
          let rc2 = _putenv("PROBE_KEY=")
          print("_putenv remove rc: \(rc2)")
          if let v = getenv("PROBE_KEY") {
              print("getenv PROBE_KEY after remove: \(String(cString: v))")
          } else {
              print("getenv PROBE_KEY after remove: nil")
          }
          EOF
          (cd envprobe && CC="${CC:-clang}" swift build) && PROBE_FROM_BASH=bashvalue LD_LIBRARY_PATH="$BORING_SWIFT_LIBDISPATCH:${LD_LIBRARY_PATH:-}" envprobe/.build/debug/EnvProbe.exe

  # Contract 3 (docs/architecture/ARCHITECTURAL-CONTRACTS.md) makes the warning
  # count an acceptance criterion: docs/specs/style/02-translator-implementation-standard.md:80
  # requires counting the warning lines in the target suite output that name
  # files under the generated trees, and requires that count to be zero. A
  # counting rule that no suite exercises produces no count, and until this job
  # no command in this workflow collected `tests/**`: all 26 scripts the other
  # jobs run are `gen:*` / `test:<target>` variants, and the single `bun test`
  # among them (`test:stage1:ts`) is scoped to the generated
  # `reference/ts/gen-tests/`. This job runs the repository's own entry point
  # (`bun run test` = `bun test tests/ packages/registry/tests/`) so the count
  # exists on every run.
  #
  # A separate job on purpose: the count must not depend on the target matrix
  # above having succeeded, and `bun run test` needs generated trees of its own
  # (see "Generate the trees the collected suite reads").
  collected-suite:
    name: collected suite (bun run test)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      # The collected suite builds and runs Swift
      # (tests/swift-readonly-boundary/readonly-boundary.test.ts runs swiftc),
      # so it needs the same userns relaxation as the linux job.
      - name: Allow user namespaces for the Swift FHS wrapper
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Restore nix closure
        uses: actions/cache@v4
        with:
          path: nix-closure.nar
          key: nix-closure-linux-${{ hashFiles('flake.lock') }}
          restore-keys: nix-closure-linux-
      - name: Import nix closure
        if: hashFiles('nix-closure.nar') != ''
        run: sudo nix-store --import < nix-closure.nar || true
      # `bun test` matches its positional arguments as path substrings, not as
      # an allowlist, so the entry point also collects the generated
      # `reference/ts/gen-tests/**` tree: 249 of the domain's files. Two domains
      # are in play and must not be conflated. The retained baseline log recorded
      # 303 files (249 generated + 54 hand-written) and its 1001 pass / 32 fail /
      # 8 errors are tied to that 303-file domain. The domain TODAY is 304 files
      # (249 generated + 55 hand-written); the extra file is
      # tests/swift-gap-boundary/gap-boundary.test.ts, which landed after the
      # baseline run and after this job was wired in. Only the file count moved -
      # 303/54 -> 304/55, not 304/54. Generating first is what keeps the count
      # taken over that domain; skipping it would silently count the hand-written
      # files alone (54 then, 55 now) and the domain report below would show the
      # smaller number.
      - name: Generate the trees the collected suite reads
        run: nix develop -c bash -c 'bun install && bun run gen:ts && bun run gen:kotlin && bun run gen:kotlin-f32 && bun run gen:rust && bun run gen:rust-f32 && bun run gen:swift && bun run gen:swift-f32 && bun run gen:dart'
      # BLOCKING ON PURPOSE - do not add `continue-on-error`. At the revision
      # that wires this in the step is RED: docs/architecture/BASELINE-FAILURES.md
      # records the inherited baseline for this exact command (1001 pass / 32
      # fail / 8 errors), and docs/architecture-work-plan.md:417 requires that
      # record - it does not waive the standard. `continue-on-error`, a narrowed
      # path argument, or an ignore pattern for a failing file would be the
      # waiver that rule forbids. `set -o pipefail` keeps the suite's exit code
      # as the step's exit code while the log is retained for the report below.
      - name: Collected suite (contract 3 count)
        run: |
          set -o pipefail
          mkdir -p out
          nix develop -c bash -c 'bun run test' 2>&1 | tee out/collected-suite.log
      # Reports, and gates, in one step: the suite's count lines, the collection
      # domain, the generated-tree warning count, and - since the round-5 ruling
      # downgraded this gate for unattributability
      # (`docs/architecture/MANAGEMENT-RULING-005.md` restoration condition 3) -
      # the failure attribution. `bun test` renders a real assertion failure, a
      # machine timeout, and the npm-artifact non-determinism almost identically
      # (`(fail) ...` plus an `error: expect(...)` block), so `32 fail` did not
      # say why the run was red without a re-run. The classification below writes
      # a per-class count and a bounded sample of each class into
      # `$GITHUB_STEP_SUMMARY`. Attribution is not waiver: every class stays a
      # failing test, the suite step above stays red on it, and the gate at the
      # end of this step is unchanged.
      - name: Report the counts, the collection domain, and the failure attribution
        if: always()
        run: |
          LOG=out/collected-suite.log
          test -f "$LOG" || { echo "::error::no log at $LOG - the collected suite never ran"; exit 1; }
          # Warning extraction: the standard (02-translator-implementation-standard.md:80)
          # counts the warning lines in the target suite output that name files
          # under the generated trees, and requires that count to be zero. A
          # warning line is a line carrying a compiler/translator warning that
          # names a path under `reference/*/gen` or `reference/*/gen-tests`.
          WARN_FILE=$(mktemp)
          grep -iE 'warn' "$LOG" | grep -E 'reference/[a-z0-9-]+/gen(-tests)?/' > "$WARN_FILE" || true
          WARN_COUNT=$(wc -l < "$WARN_FILE")
          # Gate baseline, measured not invented: the recorded proof run
          # (`docs/architecture/BASELINE-FAILURES.md`, revision 695940e8,
          # raw log dc-warn/out/ci-wire/evidence/recorded-baseline-proof-run.log)
          # contains 0 warning lines naming files under the generated trees.
          EXPECTED_GENERATED_TREE_WARNINGS=0
          case "$WARN_COUNT" in
            ''|*[!0-9]*) echo "::error::warning count is not a parseable integer (got '$WARN_COUNT') - the gate cannot be evaluated"; exit 1 ;;
          esac
          {
            echo '## Collected suite - contract 3 count'
            echo
            echo 'Standard: `docs/specs/style/02-translator-implementation-standard.md:80` counts the'
            echo 'warning lines naming files under the generated trees and requires the count to be zero.'
            echo
            echo '```'
            grep -E '^ [0-9]+ (pass|fail)$|^ [0-9]+ errors$|^Ran [0-9]+ tests across [0-9]+ files' "$LOG" || echo '(no summary line: the run did not reach a summary)'
            echo '```'
            echo
            echo 'Collected domain (top-level directories - the count means nothing without it):'
            echo
            echo '```'
            grep -oE '^[^ (]+\.test\.ts:' "$LOG" | sed 's/:$//' | sed 's|^\([^/]*/[^/]*\)/.*|\1|' | sort | uniq -c | sort -rn || true
            echo '```'
            echo
            echo 'Warning lines naming files under the generated trees'
            echo '(`reference/*/gen` and `reference/*/gen-tests` - the count means nothing without the domain):'
            echo
            echo "Generated-tree warning line count: **$WARN_COUNT**"
            echo
            if [ "$WARN_COUNT" -gt 0 ]; then
              echo '```'
              if [ "$WARN_COUNT" -gt 50 ]; then
                head -50 "$WARN_FILE"
                echo "... ($((WARN_COUNT - 50)) more line(s) truncated)"
              else
                cat "$WARN_FILE"
              fi
              echo '```'
              echo
            fi
            echo 'Baseline reconciliation: the inherited baseline'
            echo '(`docs/architecture/BASELINE-FAILURES.md`) recorded 1001 pass / 32 fail / 8 errors and **no'
            echo 'warning count**. That gap is now closed by measurement, not by invention: the retained raw'
            echo 'log of the recorded proof run (revision `695940e8`,'
            echo '`dc-warn/out/ci-wire/evidence/recorded-baseline-proof-run.log`) contains'
            echo "**$EXPECTED_GENERATED_TREE_WARNINGS** warning lines naming files under the generated trees,"
            echo 'and that measured number is the gate baseline recorded in'
            echo '`docs/architecture/BASELINE-FAILURES.md`. The standard'
            echo '(`02-translator-implementation-standard.md:80`) independently requires the count to be'
            echo 'zero; this step fails on any deviation from the baseline. Exceeding it is an acceptance'
            echo 'failure; a new baseline number must be measured and recorded, never assumed.'
            echo
            echo 'Baseline: `docs/architecture/BASELINE-FAILURES.md` (recorded per'
            echo '`docs/architecture-work-plan.md:417`; a baseline finding does not waive the standard).'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # ---- failure attribution -------------------------------------------------
          # What a reader could NOT do before: this step reported one `fail` number
          # plus the run's own error text (and, from 99ba67fd, the warning count).
          # `32 fail` did not say whether a red run was real assertion failures, a
          # machine timeout with its bun "Unhandled error between tests" cascade, or
          # the pre-existing npm-artifact byte-identity flake - all three render as
          # `(fail) ...` plus an `error: expect(...)` block, so they were
          # indistinguishable without re-running. The three crafted-log runs and the
          # six negative controls that prove this discriminates are retained at
          # dc-warn/out/ci-attribution/ (REPORT.md, evidence/). Attribution below is
          # not a waiver: every class is still a failure, the run is still red, and
          # the gate conditions at the end of this step are unchanged.
          ATTR_SAMPLE=5
          ATTR_RECAP=$(mktemp)
          ATTR_BODY=$(mktemp)   # the log with the "Unhandled error" cascade blocks cut out
          ATTR_TSV=$(mktemp)
          ATTR_CASC=$(mktemp)
          awk '/^[0-9]+ tests failed:$/{f=1;next} f && /^ [0-9]+ (pass|fail|skip)$/{exit} f' "$LOG" > "$ATTR_RECAP"
          # A cascade is `# Unhandled error between tests` / --- / text / --- . It must
          # not be mined for assertion text: bun re-prints the aborted test's
          # expectation there, which is exactly what makes it look like a product
          # failure. The closing rule is the second `---` line, but a structural line
          # also closes the block, so a malformed cascade cannot hide the rest of
          # the log (which would hide the byte-diff shape from the check below).
          awk '
            /^# Unhandled error between tests$/ {s=1; d=0; next}
            s && /^-{20,}$/ { if (++d>=2) s=0; next }
            s && /^(tests\/|reference\/|packages\/|\(pass\) |\(fail\) |# )/ {s=0}
            !s {print}
          ' "$LOG" > "$ATTR_BODY"
          ATTR_RECAP_N=$(grep -cE '^\(fail\) ' "$ATTR_RECAP" || true)
          if [ "$ATTR_RECAP_N" -gt 0 ]; then
            ATTR_SRC_NAME="the 'N tests failed:' recap (bun's authoritative, deduplicated list)"
          else
            # No recap (a crash before the recap, or a green run): fall back to the
            # inline body, deduplicated by test id because bun prints a failure
            # inline and again in the recap when both exist. The dedup must carry the
            # marker line through: the classifier reads the timeout marker from the
            # line AFTER the (fail) line, so emitting the (fail) line alone would
            # silently reclassify every timeout as an assertion.
            awk '{L[NR]=$0}
              END{for(i=1;i<=NR;i++){
                if (L[i] !~ /^\(fail\) /) continue;
                if (seen[L[i]]++) continue;
                print L[i];
                if (L[i+1] ~ /^  \^ this test timed out after [0-9]+ms\.$/) print L[i+1];
              }}' \
              "$ATTR_BODY" > "$ATTR_RECAP"
            ATTR_SRC_NAME="the inline run body, deduplicated by test id (no 'N tests failed:' recap in this log)"
            ATTR_RECAP_N=$(grep -cE '^\(fail\) ' "$ATTR_RECAP" || true)
          fi
          ATTR_SUMMARY_FAIL=$(grep -E '^ [0-9]+ fail$' "$LOG" | tail -1 | grep -oE '[0-9]+' || true)
          case "$ATTR_SUMMARY_FAIL" in ''|*[!0-9]*) ATTR_SUMMARY_FAIL="" ;; esac

          # Class 3, the known flake, is identified by test identity AND shape. The
          # identity alone is deliberately NOT enough: if that test ever fails for a
          # different reason (its own compiler exit-code assertion
          # `expect(a.exitCode).toBe(0)`, or its own 420 s budget), calling it "the
          # flake" would be the waiver the ruling forbids. The shape is the binary
          # diff bun 1.3.13 renders for `expect(Buffer).toEqual(Buffer)`, produced by
          # the byte-identity assertion
          # `expect(fs.readFileSync(second)).toEqual(fs.readFileSync(first))` - and it
          # is looked for only outside cascade blocks. The rule matches test names and
          # assertion text, never line numbers: this test file's numbering has already
          # moved once (the byte-identity test sat at :333 before the tracked-fixture
          # repair 2aadcb69 and at :320 after it), so a line-anchored rule would break
          # silently.
          ATTR_FLAKE_ID='package artifact emission > two generations of the same inputs produce byte-identical artifacts'
          ATTR_FLAKE_FILE='tests/ts/package-artifacts.test.ts'
          # Two flags, deliberately of different width:
          #   ATTR_BUFFER_DIFF - a binary toEqual diff anywhere in the log (outside the
          #                      cascades): worth surfacing, but NOT the flake class.
          #   ATTR_FLAKE_SHAPE - that diff AT the artifact byte-identity assertion, i.e.
          #                      the one shape the known flake produces. Only this one
          #                      may classify a failure as the flake.
          ATTR_BUFFER_DIFF=0
          ATTR_FLAKE_SHAPE=0
          if grep -qE '^error: expect\(received\)\.toEqual\(expected\)$' "$ATTR_BODY" &&
             grep -q '"type": "Buffer"' "$ATTR_BODY"; then
            ATTR_BUFFER_DIFF=1
            if grep -qE '^ *at <anonymous> \(.*/tests/ts/package-artifacts\.test\.ts:' "$ATTR_BODY"; then
              ATTR_FLAKE_SHAPE=1
            fi
          fi
          # `- Expected  - N` / `+ Received  + M` are rendered diff LINES, not bytes;
          # they are reported under that name, never as a byte count.
          ATTR_FLAKE_DIFF=$(grep -E '^[-+] (Expected|Received)  [-+] [0-9]+$' "$ATTR_BODY" | tr '\n' ' ' || true)

          awk -v fid="$ATTR_FLAKE_ID" -v shape="$ATTR_FLAKE_SHAPE" '
            {L[NR]=$0}
            END{
              for(i=1;i<=NR;i++){
                if (L[i] !~ /^\(fail\) /) continue;
                id=substr(L[i],8); sub(/ \[[0-9.]*ms\]$/,"",id);
                if (L[i+1] ~ /^  \^ this test timed out after [0-9]+ms\.$/) print "timeout\t" id;
                else if (shape==1 && index(id,fid)>0) print "flake-npm-artifact\t" id;
                else print "assertion\t" id;
              }
            }' "$ATTR_RECAP" > "$ATTR_TSV"

          # Cascades are attributed by file scope: a cascade in a file section that
          # already carried a `timed out after` marker is the timeout's own debris. One
          # in a file with no timeout goes to the unattributed class, so it stays visible
          # and cannot be dismissed.
          awk '
            /^[^ (]+\.test\.ts:$/ {file=$0; to=0}
            /^  \^ this test timed out after [0-9]+ms\.$/ {to=1}
            /^# Unhandled error between tests$/ {
              if (to) print "timeout-cascade\t" file; else print "unattributed-error\t" file
            }' "$LOG" > "$ATTR_CASC"

          ATTR_ASSERT_N=$(grep -c '^assertion' "$ATTR_TSV" || true)
          ATTR_TIMEOUT_N=$(grep -c '^timeout' "$ATTR_TSV" || true)
          ATTR_FLAKE_N=$(grep -c '^flake-npm-artifact' "$ATTR_TSV" || true)
          ATTR_CASC_T_N=$(grep -c '^timeout-cascade' "$ATTR_CASC" || true)
          ATTR_CASC_U_N=$(grep -c '^unattributed-error' "$ATTR_CASC" || true)
          ATTR_ATTRIBUTED=$((ATTR_ASSERT_N + ATTR_TIMEOUT_N + ATTR_FLAKE_N))
          if [ -n "$ATTR_SUMMARY_FAIL" ]; then
            ATTR_RESIDUAL=$((ATTR_SUMMARY_FAIL - ATTR_ATTRIBUTED))
          else
            ATTR_RESIDUAL="unknown"
          fi

          {
            echo '## Failure attribution (why this run is red)'
            echo
            echo "Source: $ATTR_SRC_NAME."
            echo 'A failure is one `(fail)` line; the summary line ` N fail` is the total this must add up to.'
            echo
            echo '| class | count | what it means |'
            echo '|---|---:|---|'
            echo "| real assertion failure | $ATTR_ASSERT_N | a test ran and its expectation failed - product or spec |"
            echo "| environment / timeout | $ATTR_TIMEOUT_N | carries \`this test timed out after Nms\` - a machine result, from contention |"
            echo "| npm-artifact non-determinism | $ATTR_FLAKE_N | the byte-identity test's Buffer diff - known unrelated to the change under review |"
            echo "| timeout cascade | $ATTR_CASC_T_N | \`Unhandled error between tests\` after a kill in the same file - the timeout's debris |"
            echo "| unattributed error | $ATTR_CASC_U_N | a cascade in a file with no timeout marker; NOT excused, reported as unattributed |"
            echo
            echo 'Attribution is not waiver: every class above is still a failing test and this job is still red on'
            echo 'any of them. Nothing here converts a failure into a pass, and no gate below is relaxed.'
            echo
            if [ "$ATTR_ASSERT_N" -gt 0 ]; then
              echo "**Real assertion failures** - $ATTR_ASSERT_N (sample, bounded at $ATTR_SAMPLE):"
              echo
              echo '```'
              grep '^assertion' "$ATTR_TSV" | cut -f2- | head -"$ATTR_SAMPLE"
              if [ "$ATTR_ASSERT_N" -gt "$ATTR_SAMPLE" ]; then echo "... ($((ATTR_ASSERT_N - ATTR_SAMPLE)) more truncated)"; fi
              echo '```'
              echo
            fi
            if [ "$ATTR_TIMEOUT_N" -gt 0 ]; then
              echo "**Environment / timeout failures** - $ATTR_TIMEOUT_N (sample, bounded at $ATTR_SAMPLE):"
              echo
              echo '```'
              grep '^timeout' "$ATTR_TSV" | cut -f2- | head -"$ATTR_SAMPLE"
              if [ "$ATTR_TIMEOUT_N" -gt "$ATTR_SAMPLE" ]; then echo "... ($((ATTR_TIMEOUT_N - ATTR_SAMPLE)) more truncated)"; fi
              echo '```'
              echo
            fi
            if [ "$ATTR_FLAKE_N" -gt 0 ]; then
              echo "**npm-artifact non-determinism (known flake)** - $ATTR_FLAKE_N (sample, bounded at $ATTR_SAMPLE):"
              echo
              echo '```'
              grep '^flake-npm-artifact' "$ATTR_TSV" | cut -f2- | head -"$ATTR_SAMPLE"
              echo '```'
              echo
              echo "Matched on test identity \`$ATTR_FLAKE_ID\` **and** the binary-diff shape"
              echo "(\`expect(received).toEqual(expected)\` over \`\"type\": \"Buffer\"\` at \`$ATTR_FLAKE_FILE\`)."
              echo "Rendered diff lines: $ATTR_FLAKE_DIFF"
              echo
              echo 'This is the pre-existing npm-artifact non-determinism the round-5 ruling names'
              echo '(`docs/architecture/MANAGEMENT-RULING-005.md`, restoration condition 3). It is unrelated'
              echo 'to the change under review - which is exactly why it is labelled here, so it cannot be'
              echo 'left to look like a product failure. It is **reported, not excused**: the suite step'
              echo 'above is still red on it.'
              echo
            elif [ "$ATTR_BUFFER_DIFF" = 1 ]; then
              echo 'A binary `expect(...).toEqual(...)` diff over a `"type": "Buffer"` payload is present'
              echo 'in this log, but not at the artifact byte-identity assertion, so it is **not** counted'
              echo 'as the known artifact flake. It is counted in the assertion class above and must be'
              echo 'investigated on its own merits - a byte diff elsewhere is not automatically the flake.'
              echo
            fi
            if [ "$ATTR_CASC_T_N" -gt 0 ]; then
              echo "**Timeout cascades** - $ATTR_CASC_T_N (sample, bounded at $ATTR_SAMPLE):"
              echo
              echo '```'
              grep '^timeout-cascade' "$ATTR_CASC" | cut -f2- | head -"$ATTR_SAMPLE"
              if [ "$ATTR_CASC_T_N" -gt "$ATTR_SAMPLE" ]; then echo "... ($((ATTR_CASC_T_N - ATTR_SAMPLE)) more truncated)"; fi
              echo '```'
              echo
            fi
            if [ "$ATTR_CASC_U_N" -gt 0 ]; then
              echo "**Unattributed errors** - $ATTR_CASC_U_N (sample, bounded at $ATTR_SAMPLE):"
              echo
              echo '```'
              grep '^unattributed-error' "$ATTR_CASC" | cut -f2- | head -"$ATTR_SAMPLE"
              echo '```'
              echo
            fi
            if [ -n "$ATTR_SUMMARY_FAIL" ]; then
              echo "Reconciliation: $ATTR_ATTRIBUTED failed test(s) attributed against the summary line's"
              echo "\`$ATTR_SUMMARY_FAIL fail\`; residual $ATTR_RESIDUAL. A non-zero residual means the log's"
              echo 'failure text is not fully classified by these rules - say so, never round it away.'
            else
              echo "Reconciliation: $ATTR_ATTRIBUTED failed test(s) attributed, but this log carries no"
              echo 'parseable ` N fail` summary line, so there is no total to reconcile against - the'
              echo 'residual is recorded as unknown, never as zero.'
            fi
            echo
            echo 'Limits of these rules, recorded openly: the timeout class needs the literal'
            echo '`this test timed out after Nms` marker, so a test the runner kills without that marker'
            echo 'counts as an `assertion`; the cascade rule needs the file-scope association bun does not'
            echo 'print itself; and a cascade in a file with no timeout is deliberately left unattributed.'
            echo 'Classifying a log is not running the suite - these counts describe this log only.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ATTR_RESIDUAL" != "0" ] && [ "$ATTR_RESIDUAL" != "unknown" ]; then
            echo "::warning::$ATTR_ATTRIBUTED of $ATTR_SUMMARY_FAIL failing test(s) were classified; residual $ATTR_RESIDUAL is unattributed - the log's failure text is not fully covered by the classification rules (this does not change the gate, and it does not excuse the residual)"
          fi
          if [ "$ATTR_SUMMARY_FAIL" = "" ]; then
            echo "::warning::the suite output carries no parseable ' N fail' summary line - the attribution counts above cannot be reconciled against a total (the gate below is unaffected: it turns on the warning count)"
          fi
          rm -f "$ATTR_RECAP" "$ATTR_BODY" "$ATTR_TSV" "$ATTR_CASC"
          # Warning gate: the count is compared against the measured baseline
          # (0, from the recorded proof run at 695940e8 - see
          # docs/architecture/BASELINE-FAILURES.md). Missing log, an
          # unparseable count, or any deviation from the baseline fails the
          # step; exceeding the baseline is the acceptance failure the
          # standard names, and a new baseline requires its own measured
          # record, not a quiet threshold bump. The retained full-suite log
          # contains zero such lines, so this gate is green on the recorded
          # run - a red here is a real acceptance failure.
          if [ "$WARN_COUNT" -ne "$EXPECTED_GENERATED_TREE_WARNINGS" ]; then
            echo "::error::$WARN_COUNT warning line(s) in the suite output name files under the generated trees, baseline is $EXPECTED_GENERATED_TREE_WARNINGS - acceptance failure under docs/specs/style/02-translator-implementation-standard.md:80 (a new baseline must be measured and recorded, not assumed)"
            exit 1
          fi
          # Domain guard: the generated out/ tree must never be swept into the
          # count. If it is, the count was taken over a different domain than
          # the recorded baseline and must not be read as one.
          # Reachability, recorded honestly: this guard is currently
          # structurally unreachable. `bunfig.toml` is tracked and sets
          # `[test] pathIgnorePatterns = ["out/**"]`, so `out/**` is never
          # collected and the log cannot contain an `out/` collection line;
          # and if `bunfig.toml` were removed, collection dies before emitting
          # any `out/` line at all (see `docs/architecture/BASELINE-FAILURES.md`).
          # It is kept as defense in depth against both protections drifting,
          # not as an exercised check.
          if grep -qE '^out/.*\.test\.ts:' "$LOG"; then
            echo "::error::the collected domain contains files under out/ - the generated tree is being swept into the count"
            exit 1
          fi
