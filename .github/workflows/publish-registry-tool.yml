name: Publish Registry Tool

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Generate registry tool via driver
        run: nix develop -c bash -c "bun install && boring gen registry-tool --project boring.json"

      - name: Build static binary
        run: |
          GEN_DIR=reference/registry-tool/gen
          cd "$GEN_DIR"
          echo "" >> Cargo.toml
          echo "[workspace]" >> Cargo.toml
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: reference/registry-tool/gen/target/x86_64-unknown-linux-musl/release/registry-tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
