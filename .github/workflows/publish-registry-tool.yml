name: Publish Registry Tool

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build driver
        run: bun install && haxe packages/driver/driver.hxml

      - name: Generate registry tool via driver
        run: bun out/driver/driver.js gen registry-tool --project boring.json

      - name: Build static binary
        run: |
          GEN_DIR=reference/registry-tool/gen
          cd "$GEN_DIR"
          echo "" >> Cargo.toml
          echo "[workspace]" >> Cargo.toml
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: reference/registry-tool/gen/target/x86_64-unknown-linux-musl/release/registry-tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}