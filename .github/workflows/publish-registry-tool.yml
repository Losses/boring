name: Publish Registry Tool

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Compile registry tool
        run: nix develop -c haxe packages/registry/compile.hxml
      - name: Package
        run: |
          mkdir -p /tmp/registry-tool
          cp -r packages/registry/gen/* /tmp/registry-tool/
          cp packages/registry/run.ts /tmp/registry-tool/
          tar -czf registry-tool.tar.gz -C /tmp registry-tool
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: registry-tool.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}